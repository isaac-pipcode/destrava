
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Destrava - Gestão Cultural Inteligente</title>
    <style>
      body { font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text-subtle); }

      .gov-gradient {
        background: linear-gradient(120deg, var(--primary) 0%, var(--primary-hover) 58%, var(--secondary) 140%);
      }
      
      /* Animation Utilities */
      .animate-fade-in { animation: fadeIn 0.4s ease-out; }
      .animate-fade-in-up { animation: fadeInUp 0.4s ease-out; }
      .animate-fade-in-left { animation: fadeInLeft 0.4s ease-out; }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeInLeft {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: translateX(0); }
      }

      /* Utility for hiding scrollbar but keeping scroll active */
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
  <body class="bg-bg text-ink transition-colors duration-200 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
