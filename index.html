
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>Destrava - Gestão Cultural Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              govblue: '#1351b4', // Azul Gov/Mapa
              govgreen: '#009a44', // Verde Gov
              govorange: '#f37021', // Laranja Gov
              primary: '#1351b4', 
              secondary: '#1e293b',
              accent: '#f37021',
              surface: '#f8fafc',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'], 
              display: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      .dark ::-webkit-scrollbar-thumb { background: #475569; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
      
      .gov-gradient {
        background: linear-gradient(135deg, #1351b4 0%, #009a44 100%);
      }
      
      /* Animation Utilities */
      .animate-fade-in { animation: fadeIn 0.4s ease-out; }
      .animate-fade-in-up { animation: fadeInUp 0.4s ease-out; }
      .animate-fade-in-left { animation: fadeInLeft 0.4s ease-out; }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeInLeft {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: translateX(0); }
      }

      /* Utility for hiding scrollbar but keeping scroll active */
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

  }
}
